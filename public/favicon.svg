<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The kiwi emoji as the tab icon. Drawn by the platform's own emoji font rather than
    shipped as paths, so it matches the mark used in the toolbar exactly and stays sharp
    at every size.
